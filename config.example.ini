[database]
host = 127.0.0.1
port = 3306
user = root
password =
name = mbti

[app]
# 不填写时，在 instance/secret_key 中生成并保存随机密钥。
secret_key =
base_url = http://127.0.0.1:5000
# HTTPS 部署时改为 true，本地 HTTP 保持 false。
secure_cookie = false

[mail]
# 注册审核通知收件人，与发件人可以不同。
admin_email = qiwen421@outlook.com
# 填写 SMTP 服务商提供的地址、账号与授权码。
host = smtp-mail.outlook.com
port = 587
username =
password =
sender =
# starttls 或 ssl；不会以明文方式连接 SMTP。
security = starttls
# password 或 oauth2；Microsoft 邮箱可使用 OAuth2 访问令牌。
auth = oauth2
oauth_token =
# 填写 client_id 和 refresh_token 后会自动获取并续期访问令牌。
# 个人 Outlook.com 账号使用 consumers；组织账号可填写租户 ID。
oauth_client_id =
oauth_client_secret =
oauth_refresh_token =
oauth_tenant = consumers
